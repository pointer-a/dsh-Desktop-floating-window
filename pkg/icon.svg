<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Desktop Task Box">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2E3138"/>
      <stop offset="1" stop-color="#131417"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#2B7FFF"/>
    </linearGradient>
  </defs>
  <!-- 底板 -->
  <rect width="256" height="256" rx="60" fill="url(#panel)"/>
  <!-- 后面的主窗口（未激活灰） -->
  <rect x="40" y="52" width="136" height="106" rx="18" fill="#191B1F" stroke="#4C525D" stroke-width="7"/>
  <rect x="58" y="74" width="60" height="9" rx="4.5" fill="#4C525D"/>
  <rect x="58" y="93" width="92" height="8" rx="4" fill="#3A3F48"/>
  <rect x="58" y="111" width="74" height="8" rx="4" fill="#3A3F48"/>
  <!-- 前面的浮窗（品牌蓝描边，置顶） -->
  <rect x="106" y="118" width="110" height="88" rx="20" fill="#0F1013" stroke="url(#accent)" stroke-width="7"/>
  <circle cx="128" cy="143" r="7.5" fill="url(#accent)"/>
  <rect x="144" y="137" width="48" height="11" rx="5.5" fill="#C7CEDA"/>
  <rect x="124" y="162" width="72" height="9" rx="4.5" fill="#5A6170"/>
  <rect x="124" y="180" width="44" height="9" rx="4.5" fill="#5A6170"/>
  <!-- 待确认点：琥珀 -->
  <circle cx="196" cy="184" r="8" fill="#F5A623"/>
</svg>
